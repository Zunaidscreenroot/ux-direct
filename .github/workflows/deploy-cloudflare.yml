name: Deploy UX Direct to Cloudflare

# Beta priority: ship every main-branch change to production without waiting
# for duplicate CI validation. Keep manual dispatch for recovery/redeploys.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# A newer desired version supersedes the current rollout and any pending run.
concurrency:
  group: ux-direct-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Build for Cloudflare Workers
        run: npm run cf:build
      - name: Deploy production Worker
        run: npx opennextjs-cloudflare deploy --config wrangler.jsonc -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cb73bfd260a197b57210ae47f427db06
