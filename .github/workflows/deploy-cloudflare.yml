name: Deploy UX Direct to Cloudflare

# The native Figma canvas bridge is deployed automatically when its server routes
# change. Keep manual dispatch available for a controlled redeploy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/api/mcp/route.ts"
      - "app/api/plugin-bridge/route.ts"
      - "app/api/health/route.ts"
      - "app/api/brain/**"
      - "app/api/assistant/chat/route.ts"
      - "src/memory/**"
      - "src/security/figma-access.ts"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: ux-direct-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check application
        run: npm run typecheck
      - name: Check Figma plugin syntax
        run: node --check figma-plugin/code.js
      - name: Run tests
        run: npm test
      - name: Build for Cloudflare Workers
        run: npm run cf:build
      - name: Deploy production Worker
        run: npx opennextjs-cloudflare deploy -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cb73bfd260a197b57210ae47f427db06
