name: Model gateway validation

# The general UX Direct CI already runs the full suite on every PR.
# Keep this focused workflow for the gateway branch and manual diagnostics.
on:
  push:
    branches: [feat/zero-cost-model-gateway]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-direct-gateway-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
