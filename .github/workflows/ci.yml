name: UX Direct CI

on:
  push:
    branches: [main, work/vercel-cockpit-preflight, feat/hybrid-context-knowledge]
  pull_request:
    branches: [main, work/vercel-cockpit-preflight]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Native Figma plugin syntax
        run: node --check figma-plugin/code.js
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
