name: UX Direct CI

on:
  push:
    branches: [main, work/vercel-cockpit-preflight, feat/hybrid-context-knowledge]
  pull_request:
    branches: [main, work/vercel-cockpit-preflight]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Native Figma plugin syntax
        run: node --check figma-plugin/code.js
      - name: Cockpit UI script syntax
        run: |
          node -e 'const fs = require("node:fs"); const { spawnSync } = require("node:child_process"); const html = fs.readFileSync("figma-plugin/ui.html", "utf8"); const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]; if (!scripts.length) throw new Error("No inline Cockpit UI script found"); for (let i = 0; i < scripts.length; i++) { const file = ".cockpit-ui-check-" + i + ".js"; fs.writeFileSync(file, scripts[i][1]); const result = spawnSync(process.execPath, ["--check", file], { encoding: "utf8" }); fs.unlinkSync(file); if (result.status !== 0) { process.stderr.write(result.stderr || result.stdout); process.exit(result.status || 1); } }'
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
