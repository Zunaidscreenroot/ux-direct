name: UX Direct CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep only the newest validation run for each PR or branch.
concurrency:
  group: ux-direct-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Figma cockpit effects
        run: npm run build:figma-plugin-effects
      - name: Native Figma plugin syntax
        run: node --check figma-plugin/code.js && node --check figma-plugin/ui-effects.js
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
