name: Cloudflare migration checks

on:
  push:
    branches:
      - cloudflare-migration

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Commit updated npm lockfile when needed
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update lockfile for Cloudflare migration"
            git push
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for Cloudflare Workers
        run: npm run cf:build
