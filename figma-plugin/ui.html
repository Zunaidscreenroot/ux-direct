<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UX Direct · Conversational Cockpit</title>
  <style>
    :root { color-scheme: light dark; font: 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { height: 100vh; min-height: 0; margin: 0; padding: 10px 12px 0; display:flex; flex-direction:column; overflow:hidden; color:var(--figma-color-text,#202124); background:var(--figma-color-bg,#fff); }
    header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px; margin-bottom:7px; }
    .brand { display:flex; align-items:center; gap:7px; font-size:14px; font-weight:750; letter-spacing:-.25px; white-space:nowrap; }
    .mark { display:grid; place-items:center; width:25px; height:25px; border-radius:7px; background:#252525; color:#fff; font-size:12px; font-weight:800; }
    .statusbar { display:flex; align-items:center; justify-content:flex-end; gap:4px; min-width:0; }
    .status-tag { display:inline-flex; align-items:center; gap:5px; max-width:124px; min-width:0; border:1px solid var(--figma-color-border); border-radius:999px; padding:4px 6px; background:var(--figma-color-bg-secondary); color:var(--figma-color-text-secondary); font-family:inherit; font-size:9px; font-weight:600; line-height:1.15; cursor:default; white-space:nowrap; }
    button.status-tag { cursor:pointer; }
    .status-tag:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--figma-color-bg-brand,#2563eb); outline-offset:2px; }
    .status-tag .tagtext { overflow:hidden; text-overflow:ellipsis; }
    .dot { flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:#b8a16a; }
    .status-tag.ok { color:#22845d; border-color:rgba(34,132,93,.28); background:rgba(34,132,93,.08); }
    .status-tag.ok .dot { background:#26966b; }
    .status-tag.bad { color:#c53f45; border-color:rgba(197,63,69,.3); background:rgba(197,63,69,.08); }
    .status-tag.bad .dot { background:#d14343; }
    .status-tag.warn .dot { background:#c18a24; }
    .muted { color:var(--figma-color-text-secondary); }
    .chat { display:flex; flex:1 1 auto; flex-direction:column; min-height:0; overflow:hidden; }
    .chatlog { display:flex; flex:1 1 auto; flex-direction:column; gap:12px; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:8px 2px 14px; scroll-behavior:smooth; }
    .message { display:flex; flex-direction:column; gap:4px; width:100%; }
    .message.user { align-items:flex-end; }
    .message.assistant { align-items:flex-start; }
    .message-label { color:var(--figma-color-text-tertiary,var(--figma-color-text-secondary)); font-size:10px; padding:0 3px; }
    .bubble { max-width:94%; border-radius:12px; padding:9px 11px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .assistant .bubble { background:var(--figma-color-bg-secondary,#f3f4f6); border:1px solid var(--figma-color-border, #e6e6e6); border-top-left-radius:4px; }
    .user .bubble { color:var(--figma-color-text-onbrand,#fff); background:var(--figma-color-bg-brand,#2563eb); border-top-right-radius:4px; }
    .message-meta { color:var(--figma-color-text-tertiary,var(--figma-color-text-secondary)); font-size:9px; padding:0 3px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:5px; margin:0 1px 4px; }
    .suggestion { border:1px solid var(--figma-color-border); border-radius:999px; padding:6px 8px; background:transparent; color:var(--figma-color-text); font-size:10px; line-height:1.2; font-weight:550; cursor:pointer; }
    .suggestion:hover { background:var(--figma-color-bg-secondary); }
    .typing { display:flex; align-items:center; gap:5px; color:var(--figma-color-text-secondary); font-size:10px; padding:7px 10px; }
    .typing-dot { width:4px; height:4px; border-radius:50%; background:currentColor; animation:pulse 1s infinite alternate; }
    .typing-dot:nth-child(2) { animation-delay:.2s; }
    .typing-dot:nth-child(3) { animation-delay:.4s; }
    @keyframes pulse { from { opacity:.25; } to { opacity:1; } }
    .composer { flex:0 0 auto; border-top:1px solid var(--figma-color-border); padding:8px 0 10px; background:var(--figma-color-bg); }
    .composer-context { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:22px; margin-bottom:6px; color:var(--figma-color-text-secondary); font-size:10px; }
    #contextText { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .project-select { width:auto; max-width:118px; border:1px solid var(--figma-color-border); border-radius:7px; padding:4px 6px; background:var(--figma-color-bg); color:var(--figma-color-text); font-size:10px; }
    .input-shell { display:flex; align-items:flex-end; gap:7px; padding:6px; border:1px solid var(--figma-color-border); border-radius:12px; background:var(--figma-color-bg); }
    textarea { display:block; flex:1 1 auto; width:100%; min-width:0; min-height:54px; max-height:132px; resize:vertical; border:0; outline:0; padding:6px 4px; background:transparent; color:var(--figma-color-text); font:inherit; line-height:1.5; }
    textarea:focus-visible { outline:none; }
    textarea::placeholder { color:var(--figma-color-text-tertiary,var(--figma-color-text-secondary)); }
    .send { display:grid; place-items:center; flex:0 0 34px; width:34px; height:34px; padding:0; border-radius:9px; background:var(--figma-color-bg-brand,#2563eb); color:var(--figma-color-text-onbrand,#fff); font-size:17px; font-weight:700; }
    .send:disabled { cursor:not-allowed; opacity:.4; }
    .activity { min-height:14px; padding:4px 3px 0; color:var(--figma-color-text-tertiary,var(--figma-color-text-secondary)); font-size:9px; line-height:1.35; }
    .health-panel { position:fixed; z-index:20; top:47px; left:10px; right:10px; max-height:calc(100vh - 58px); overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--figma-color-border); border-radius:12px; background:var(--figma-color-bg); box-shadow:0 8px 32px rgba(0,0,0,.18); }
    .health-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 12px 8px; border-bottom:1px solid var(--figma-color-border); }
    .health-head strong { font-size:12px; }
    .close-health { width:26px; height:26px; padding:0; border-radius:7px; background:var(--figma-color-bg-secondary); color:var(--figma-color-text); }
    .health-summary { margin:0; padding:9px 12px; color:var(--figma-color-text-secondary); font-size:10px; line-height:1.45; }
    .health-results { overflow-y:auto; min-height:60px; padding:0 12px 10px; }
    .health-row { display:grid; grid-template-columns:72px minmax(0,1fr); gap:7px; align-items:start; padding:7px 0; border-top:1px solid var(--figma-color-border); line-height:1.4; }
    .health-badge { font-size:9px; font-weight:750; letter-spacing:.15px; }
    .health-badge.pass { color:#26966b; }
    .health-badge.fail { color:#d14343; }
    .health-badge.na { color:#b07b24; }
    .health-name { font-weight:650; overflow-wrap:anywhere; }
    .health-reason { margin-top:3px; color:var(--figma-color-text-secondary); font-size:10px; overflow-wrap:anywhere; }
    @media (max-width:340px) {
      body { padding-left:8px; padding-right:8px; }
      .brand { font-size:12px; }
      .status-tag { padding:4px 5px; max-width:104px; font-size:8px; }
      .mark { width:22px; height:22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">ux</span><span>UX Direct</span></div>
    <div class="statusbar" aria-label="System status">
      <div id="connectionStatus" class="status-tag warn" aria-live="polite"><span id="connectionDot" class="dot"></span><span id="connectionText" class="tagtext">Connecting</span></div>
      <button id="healthStatus" class="status-tag warn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="healthPanel" title="View Plugin API health-check details"><span id="healthDot" class="dot"></span><span id="healthStatusText" class="tagtext">Health pending</span></button>
    </div>
  </header>

  <main class="chat">
    <div id="chatLog" class="chatlog" role="log" aria-live="polite" aria-relevant="additions text"></div>
    <div class="composer">
      <div class="composer-context">
        <span id="contextText">Reading Figma selection…</span>
        <select id="project" class="project-select" aria-label="Current project">
          <option value="general">General UX</option>
          <option value="dmi-finance">DMI Finance</option>
          <option value="express-computers">Express Computers</option>
        </select>
      </div>
      <form id="chatForm">
        <div class="input-shell">
          <textarea id="prompt" maxlength="5000" rows="2" aria-label="Message UX Direct" placeholder="Ask UX Direct to plan, critique, design or refine…" required></textarea>
          <button id="send" class="send" type="submit" aria-label="Send message" title="Send message" disabled>↑</button>
        </div>
      </form>
      <div id="activity" class="activity" role="status">Connecting to your UX Director…</div>
    </div>
  </main>

  <section id="healthPanel" class="health-panel" aria-label="Plugin API health-check details" hidden>
    <div class="health-head"><strong>Plugin health checks</strong><button id="closeHealth" class="close-health" type="button" aria-label="Close health details">×</button></div>
    <p id="healthSummary" class="health-summary">The health suite runs automatically after the backend connection is verified.</p>
    <div id="healthResults" class="health-results"><div class="muted">Waiting for the first report…</div></div>
  </section>

  <script>
    const API = "https://deploy-preview-21--uxdirect.netlify.app"; // TEMPORARY: preview backend for Figma smoke testing; restore production URL before merge.
    const ALLOWED_FILE_KEY = "QJhcsebwscpdMJDNh9UsYS";
    const $ = (id) => document.getElementById(id);
    let verifiedFileKey = null;
    let pluginSessionStarted = false;
    let backendHealthy = false;
    let bridgeReady = false;
    let autoHealthStarted = false;
    let healthCheckRunning = false;
    let healthTimeout = null;
    let heartbeatTimer = null;
    let isSending = false;
    let currentSelection = { fileKey: null, pageName: "", selection: [] };
    const chatHistory = [];
    const handledBridgeCommands = new Set();

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
      return "uxd-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }
    const pluginClientId = makeId();
    const pluginSessionToken = makeId() + makeId();

    function setActivity(message) { $("activity").textContent = message || ""; }
    function setConnection(state, label) {
      $("connectionStatus").className = "status-tag " + state;
      $("connectionDot").className = "dot";
      $("connectionText").textContent = label;
      $("connectionStatus").title = state === "ok" ? "UX Direct backend is reachable" : label;
    }
    function setHealth(state, label) {
      $("healthStatus").className = "status-tag " + state;
      $("healthDot").className = "dot";
      $("healthStatusText").textContent = label;
      $("healthStatus").title = state === "ok" ? "All executed health checks passed. Click for details." : "Click to inspect Plugin API health-check details.";
    }
    function toggleHealthPanel(open) {
      const show = typeof open === "boolean" ? open : $("healthPanel").hidden;
      $("healthPanel").hidden = !show;
      $("healthStatus").setAttribute("aria-expanded", String(show));
    }
    function appendMessage(role, content, meta) {
      const row = document.createElement("article");
      row.className = "message " + role;
      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = role === "user" ? "You" : "UX Direct";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = String(content || "");
      row.append(label, bubble);
      if (meta) {
        const details = document.createElement("div");
        details.className = "message-meta";
        details.textContent = meta;
        row.appendChild(details);
      }
      $("chatLog").appendChild(row);
      $("chatLog").scrollTop = $("chatLog").scrollHeight;
      return row;
    }
    function showTyping() {
      const row = document.createElement("div");
      row.id = "typing";
      row.className = "typing";
      row.setAttribute("aria-label", "UX Direct is thinking");
      row.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span><span style="margin-left:3px">Thinking through this…</span>';
      $("chatLog").appendChild(row);
      $("chatLog").scrollTop = $("chatLog").scrollHeight;
    }
    function hideTyping() { const typing = $("typing"); if (typing) typing.remove(); }
    function showSuggestions() {
      const root = document.createElement("div");
      root.className = "suggestions";
      [
        ["Plan DMI VKYC", "Help me plan the DMI Finance VKYC entry point and end-to-end journey, including consent, loading, errors and recovery."],
        ["Review selection", "Review the selected Figma context. Tell me what metadata is available, what is still needed for a proper visual UX audit, and propose a review checklist."],
        ["Express Batch 3", "Help me structure the Express Computers Batch 3 wireframe work into a review-ready UX plan."]
      ].forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "suggestion";
        button.textContent = item[0];
        button.addEventListener("click", () => sendChatMessage(item[1]));
        root.appendChild(button);
      });
      $("chatLog").appendChild(root);
    }
    appendMessage("assistant", "Hi, I’m UX Direct — your conversational UX Director.\n\nTell me what you’re working on. We can reason through the problem, plan the journey, critique UX decisions, define edge states and prepare review-ready work. I’ll keep the conversation in context and be clear about what has—and hasn’t—actually been executed.");
    showSuggestions();

    async function sendTelemetry(eventName, result, summary, details) {
      if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) return false;
      try {
        const response = await fetch(API + "/api/telemetry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign({
            source: "figma-plugin", fileKey: verifiedFileKey,
            event: eventName, status: result, summary
          }, details || {}))
        });
        return response.ok;
      } catch (error) {
        console.warn("[UX Direct telemetry]", eventName, error);
        return false;
      }
    }

    async function bridgeRequest(payload) {
      if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) {
        throw new Error("Approved Figma file scope is not verified.");
      }
      const response = await fetch(API + "/api/plugin-bridge", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({}, payload, {
          fileKey: verifiedFileKey, clientId: pluginClientId, sessionToken: pluginSessionToken
        }))
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Plugin bridge returned " + response.status);
      return data;
    }

    async function checkConnection() {
      try {
        if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) throw new Error("Approved Figma file scope is not verified.");
        const response = await fetch(API + "/api/health?fileKey=" + encodeURIComponent(verifiedFileKey), { method: "GET", cache: "no-store" });
        if (!response.ok) throw new Error("Backend returned HTTP " + response.status);
        const data = await response.json();
        if (!data || data.status !== "ok" || !data.deployment || data.deployment.platform !== "netlify") {
          throw new Error("The endpoint did not verify itself as the UX Direct backend.");
        }
        backendHealthy = true;
        setConnection("ok", "Connected");
        $("send").disabled = isSending;
        return data;
      } catch (error) {
        backendHealthy = false;
        setConnection("bad", "Offline");
        $("send").disabled = true;
        setActivity("UX Direct backend is unavailable. The plugin will retry automatically.");
        console.warn("[UX Direct backend health]", error);
        return null;
      }
    }

    function queueAutoHealthCheck() {
      if (autoHealthStarted || healthCheckRunning || !backendHealthy || !bridgeReady || verifiedFileKey !== ALLOWED_FILE_KEY) return;
      autoHealthStarted = true;
      healthCheckRunning = true;
      setHealth("warn", "Checking health…");
      $("healthSummary").textContent = "Running the native Plugin API suite in the dedicated UXD API Test Lab page. The active design page and selected frames are not used as test fixtures.";
      $("healthResults").replaceChildren();
      setActivity("Connected. Running automatic Plugin API checks…");
      window.setTimeout(() => {
        if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) return;
        parent.postMessage({ pluginMessage: { type: "run-native-health-check" } }, "*");
        healthTimeout = window.setTimeout(() => {
          if (!healthCheckRunning) return;
          healthCheckRunning = false;
          setHealth("bad", "Health check failed");
          $("healthSummary").textContent = "The health suite did not return a complete report within 90 seconds.";
          $("healthResults").replaceChildren();
          appendHealthRow("FAIL", "Health suite response", "No complete report was returned within 90 seconds.", "fail");
          setActivity("Automatic health check timed out. Restart the plugin to try again.");
        }, 90000);
      }, 1600);
    }

    async function syncPluginBridge() {
      try {
        const heartbeat = await bridgeRequest({ mode: "heartbeat" });
        bridgeReady = true;
        if (!backendHealthy) await checkConnection();
        const command = heartbeat && heartbeat.command;
        if (command && command.action === "native-api-health-check" && command.commandId && !handledBridgeCommands.has(command.commandId)) {
          handledBridgeCommands.add(command.commandId);
          if (!healthCheckRunning) {
            autoHealthStarted = true;
            healthCheckRunning = true;
            setHealth("warn", "Checking health…");
            parent.postMessage({ pluginMessage: { type: "run-native-health-check", commandId: command.commandId } }, "*");
          }
        }
        if (backendHealthy) queueAutoHealthCheck();
        return { ok: true };
      } catch (error) {
        bridgeReady = false;
        console.warn("[UX Direct plugin bridge]", error);
        if (!backendHealthy) setConnection("bad", "Offline");
        return { ok: false, error: error && error.message ? error.message : "Unknown bridge error" };
      }
    }

    async function startPluginSession() {
      void sendTelemetry("Plugin opened", "success", "UX Direct conversational cockpit initialized in the approved Figma file.");
      const connection = await checkConnection();
      if (connection) {
        const bridge = await syncPluginBridge();
        if (!bridge.ok) {
          setActivity("Backend is connected; the plugin bridge is reconnecting. Health checks will start once it is ready.");
          setHealth("warn", "Health queued");
        } else {
          setActivity("Connected. Running health checks automatically, then you can start chatting.");
          queueAutoHealthCheck();
        }
      } else {
        setHealth("bad", "Health check blocked");
      }
      if (heartbeatTimer) window.clearInterval(heartbeatTimer);
      heartbeatTimer = window.setInterval(async () => {
        if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) return;
        if (!backendHealthy) {
          const health = await checkConnection();
          if (health) await syncPluginBridge();
        } else {
          await syncPluginBridge();
        }
      }, 90000);
    }

    window.addEventListener("pagehide", () => {
      if (heartbeatTimer) window.clearInterval(heartbeatTimer);
      if (healthTimeout) window.clearTimeout(healthTimeout);
      if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) return;
      const body = JSON.stringify({
        mode: "disconnect", fileKey: verifiedFileKey,
        clientId: pluginClientId, sessionToken: pluginSessionToken
      });
      try {
        if (navigator.sendBeacon) navigator.sendBeacon(API + "/api/plugin-bridge", new Blob([body], { type: "application/json" }));
      } catch (_) {}
    });

    function appendHealthRow(label, name, reason, level) {
      const row = document.createElement("div");
      row.className = "health-row";
      const badge = document.createElement("div");
      badge.className = "health-badge " + level;
      badge.textContent = label;
      const detail = document.createElement("div");
      const title = document.createElement("div");
      title.className = "health-name";
      title.textContent = name;
      const why = document.createElement("div");
      why.className = "health-reason";
      why.textContent = reason || "No additional details provided.";
      detail.append(title, why);
      row.append(badge, detail);
      $("healthResults").appendChild(row);
    }

    function renderHealthReport(message) {
      if (healthTimeout) window.clearTimeout(healthTimeout);
      healthCheckRunning = false;
      const checks = Array.isArray(message.checks) ? message.checks : [];
      const passed = Number(message.passed || 0);
      const available = Number(message.available || 0);
      const reportedFailures = Number(message.failed || 0);
      const failed = Math.max(reportedFailures, checks.filter((item) => item && item.status === "error" && item.level !== "availability").length);
      const notTested = Number(message.notTested || 0);
      const checkedAt = message.checkedAt ? new Date(message.checkedAt).toLocaleTimeString() : "just now";
      const suiteInvalid = checks.length === 0;
      const healthFailed = failed > 0 || suiteInvalid;
      const label = healthFailed ? "Health check failed" : "Health check passed";
      setHealth(healthFailed ? "bad" : "ok", label);
      $("healthSummary").textContent = passed + " passed · " + failed + " failed · " + available + " available · " + notTested + " not tested · " + checkedAt + ". Team Library access remains intentionally not tested.";
      $("healthResults").replaceChildren();
      if (suiteInvalid) appendHealthRow("FAIL", "Health report", "The plugin returned no individual check results; the suite cannot be considered passed.", "fail");
      checks.forEach((item) => {
        const isNotTested = item.status === "not-tested" || item.level === "not-tested";
        const ok = item.status === "success";
        const labelText = isNotTested
          ? (/team library/i.test(item.name || "") ? "NOT TESTED INTENTIONALLY" : "NOT TESTED")
          : ok ? (item.level === "availability" ? "AVAILABLE" : "PASS") : "FAIL";
        appendHealthRow(labelText, "[" + (item.category || "General") + " · " + (item.level || "functional") + "] " + (item.name || "Unnamed check"), item.reason || "", isNotTested ? "na" : ok ? "pass" : "fail");
      });
      void sendTelemetry("Plugin API health check completed", failed > 0 ? "warning" : "success",
        "Native Plugin API self-test: " + passed + " passed, " + failed + " failed, " + available + " available, " + notTested + " not tested.");
      void bridgeRequest({
        mode: "result",
        commandId: message.commandId || undefined,
        healthReport: { passed, available, failed, notTested, checkedAt: message.checkedAt, checks }
      }).then(() => {
        setActivity(healthFailed ? "Health check finished with failures or an incomplete report. Click the red tag to inspect it." : "Health check passed. Ask me what you want to work on.");
      }).catch((error) => {
        console.warn("[UX Direct health report sync]", error);
        setActivity("Health result is available here, but syncing it to the backend failed.");
      });
    }

    function updateSelectionContext(message) {
      currentSelection = message;
      const count = Array.isArray(message.selection) ? message.selection.length : 0;
      $("contextText").textContent = count
        ? (message.pageName || "Current page") + " · " + count + " selected"
        : (message.pageName || "Current page") + " · No selection";
      $("contextText").title = count
        ? "Selected frame/layer metadata will be shared with the assistant; screenshots are not sent by this chat."
        : "Select frames or layers in Figma to provide node metadata as context.";
    }

    async function sendChatMessage(overrideText) {
      if (isSending) return;
      const prompt = (typeof overrideText === "string" ? overrideText : $("prompt").value).trim();
      if (prompt.length < 1) return;
      if (!verifiedFileKey || verifiedFileKey !== ALLOWED_FILE_KEY) {
        appendMessage("assistant", "I can’t start a conversation until this Figma document passes the approved-file check.");
        return;
      }
      if (!backendHealthy) {
        appendMessage("assistant", "The UX Direct backend is offline right now. I’ll reconnect automatically—please send your message again once the top status returns to Connected.");
        return;
      }

      chatHistory.push({ role: "user", content: prompt });
      appendMessage("user", prompt);
      $("prompt").value = "";
      $("send").disabled = true;
      $("prompt").disabled = true;
      isSending = true;
      showTyping();
      setActivity("Thinking…");

      const selectedNodes = Array.isArray(currentSelection.selection) ? currentSelection.selection.slice(0, 12).map((node) => ({
        name: String(node.name || "").slice(0, 160),
        type: String(node.type || "").slice(0, 60),
        id: String(node.id || "").slice(0, 200),
        ...(Number.isFinite(node.width) ? { width: node.width } : {}),
        ...(Number.isFinite(node.height) ? { height: node.height } : {})
      })) : [];
      try {
        const response = await fetch(API + "/api/assistant/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fileKey: verifiedFileKey,
            project: $("project").value,
            messages: chatHistory.slice(-12),
            selection: {
              pageName: String(currentSelection.pageName || "").slice(0, 160),
              totalCount: Array.isArray(currentSelection.selection) ? currentSelection.selection.length : 0,
              items: selectedNodes
            }
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "The assistant returned HTTP " + response.status + (data.requestId ? " · Request " + data.requestId : ""));
        if (typeof data.content !== "string" || !data.content.trim()) throw new Error("The assistant returned an empty message. Please try again.");
        chatHistory.push({ role: "assistant", content: data.content });
        appendMessage("assistant", data.content, (data.provider || "AI") + " · " + (data.model || "model") + " · " + Math.max(0, Math.round(Number(data.latencyMs || 0))) + " ms");
        setActivity("Response received. Continue the conversation or give me the next task.");
      } catch (error) {
        const message = error && error.message ? error.message : "Unknown chat error";
        appendMessage("assistant", "I couldn’t complete that response: " + message + "\n\nYour message is still in this session’s conversation context. You can retry or continue with a smaller request.");
        setActivity("Response failed. Your Figma document was not changed by this chat request.");
      } finally {
        hideTyping();
        isSending = false;
        $("prompt").disabled = false;
        $("send").disabled = !backendHealthy;
        $("prompt").focus();
      }
    }

    $("chatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      void sendChatMessage();
    });
    $("prompt").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        void sendChatMessage();
      }
    });
    $("healthStatus").addEventListener("click", () => toggleHealthPanel());
    $("closeHealth").addEventListener("click", () => toggleHealthPanel(false));
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") toggleHealthPanel(false);
    });

    parent.postMessage({ pluginMessage: { type: "get-selection" } }, "*");
    window.onmessage = (event) => {
      const message = event.data && event.data.pluginMessage;
      if (!message) return;

      if (message.type === "scope-approved") {
        if (message.fileKey !== ALLOWED_FILE_KEY) {
          setConnection("bad", "File blocked");
          setHealth("bad", "Health blocked");
          setActivity("UX Direct is restricted to the approved Figma document.");
          appendMessage("assistant", "This file is not allowlisted for UX Direct. No backend connection, health suite or task request will run.");
          return;
        }
        verifiedFileKey = message.fileKey;
        currentSelection.fileKey = message.fileKey;
        if (!pluginSessionStarted) {
          pluginSessionStarted = true;
          void startPluginSession();
        }
        return;
      }

      if (message.type === "native-api-probe") {
        parent.postMessage({ pluginMessage: { type: "native-api-probe-ack", probeId: message.probeId } }, "*");
        return;
      }

      if (message.type === "native-health-progress") {
        healthCheckRunning = true;
        setHealth("warn", "Checking health…");
        if (message.text) $("healthSummary").textContent = message.text;
        return;
      }

      if (message.type === "native-health-result") {
        renderHealthReport(message);
        return;
      }

      if (message.type !== "selection") return;
      if (message.fileKey !== ALLOWED_FILE_KEY) return;
      updateSelectionContext(message);
    };
  </script>
</body>
</html>
